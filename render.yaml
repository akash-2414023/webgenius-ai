services:
  # -------------------------------------------------------------
  # 1. WebGenius AI Backend API (Node.js Express Web Service)
  # -------------------------------------------------------------
  - type: web
    name: webgenius-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MONGODB_DB_NAME
        value: webgenius_ai
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

  # -------------------------------------------------------------
  # 2. WebGenius AI Frontend UI (React + Vite Static Site)
  # -------------------------------------------------------------
  - type: web
    name: webgenius-ui
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
